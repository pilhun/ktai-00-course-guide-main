<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Python 기초 · 한 가지씩 배우기</title><desc id="desc">출력, 변수와 계산, 조건, 반복, 딕셔너리, 함수 순서. 파일과 고객 문의는 선택 응용.</desc><rect width="1400" height="430" fill="#eef4fb"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#17345b"><text x="35" y="55" font-size="33" font-weight="700">작은 프로그램으로 Python 기초 익히기</text><text x="35" y="100" font-size="23">숫자 두 개의 합 → 여러 수의 합 → 함수로 묶기</text><rect x="35" y="140" width="205" height="140" rx="12" fill="white" stroke="#b9cce2"/><text x="47" y="183" font-size="24" font-weight="700">01 출력</text><text x="47" y="234" font-size="21">인사말 출력</text><rect x="260" y="140" width="205" height="140" rx="12" fill="white" stroke="#b9cce2"/><text x="272" y="183" font-size="24" font-weight="700">02 변수·계산</text><text x="272" y="234" font-size="21">숫자 두 개 더하기</text><rect x="485" y="140" width="205" height="140" rx="12" fill="white" stroke="#b9cce2"/><text x="497" y="183" font-size="24" font-weight="700">03 조건</text><text x="497" y="234" font-size="21">양수·음수 판단</text><rect x="710" y="140" width="205" height="140" rx="12" fill="white" stroke="#b9cce2"/><text x="722" y="183" font-size="24" font-weight="700">04 반복·목록</text><text x="722" y="234" font-size="21">1~10 합계</text><rect x="935" y="140" width="205" height="140" rx="12" fill="white" stroke="#b9cce2"/><text x="947" y="183" font-size="24" font-weight="700">05 딕셔너리</text><text x="947" y="234" font-size="21">이름·점수 읽기</text><rect x="1160" y="140" width="205" height="140" rx="12" fill="white" stroke="#b9cce2"/><text x="1172" y="183" font-size="24" font-weight="700">06 함수</text><text x="1172" y="234" font-size="21">덧셈 기능 재사용</text><text x="35" y="330" font-size="24">설명 → 예제 실행 → 한 곳 수정 → 비슷한 문제 → 풀이 확인</text><text x="35" y="382" font-size="22">파일·JSON·고객 문의 앱은 기초를 익힌 뒤 선택해서 봅니다.</text></g></svg>