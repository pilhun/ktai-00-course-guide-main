<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-label="온라인 실습에서 문서·코드·실행 결과를 확인하는 순서"><rect width="1200" height="530" fill="#f4f7fb"/><g font-family="sans-serif" fill="#123255"><text x="40" y="55" font-size="30">온라인 실습 · 같은 위치를 보며 한 부분씩 확인합니다</text><rect x="35" y="85" width="1130" height="85" rx="12" fill="white" stroke="#a4bbd5"/><text x="55" y="120" font-size="26">1. 교재에서 오늘 위치 확인</text><text x="55" y="153" font-size="22">교과·파트·랩 이름 → 설명과 기본 결과 읽기</text><rect x="35" y="185" width="1130" height="85" rx="12" fill="white" stroke="#a4bbd5"/><text x="55" y="220" font-size="26">2. Python 파일에서 입력 한 곳 수정</text><text x="55" y="253" font-size="22">파일 이름·원래 줄 확인 → 저장 → 같은 파일 실행</text><rect x="35" y="285" width="1130" height="85" rx="12" fill="white" stroke="#a4bbd5"/><text x="55" y="320" font-size="26">3. Terminal에서 마지막 실행 결과 읽기</text><text x="55" y="353" font-size="22">입력 대기·서버 실행·모델 준비·오류를 구분</text><rect x="35" y="385" width="1130" height="105" rx="12" fill="white" stroke="#a4bbd5"/><text x="55" y="420" font-size="26">막혔다면 현재 위치와 오류를 공유</text><text x="55" y="453" font-size="22">파일·실행한 방법·오류 마지막 부분 → 확인 후 같은 입력으로 재실행</text></g></svg>