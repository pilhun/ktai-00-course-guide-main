<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><rect width="1600" height="640" fill="#edf4ff"/><g font-family="Malgun Gothic, sans-serif" fill="#142e4e"><text x="60" y="82" font-size="48" font-weight="700">사용자의 질문을 Python으로 다루기</text><text x="60" y="142" font-size="26">question은 사용자가 묻는 내용입니다. 같은 이름을 반복해서 사용하며 익혀 봅니다.</text><rect x="60.0" y="190" width="353.5" height="350" rx="20" fill="white" stroke="#b8cbea"/><text x="85.0" y="248" font-size="31" font-weight="700" fill="#2059a5">1. 변수</text><text x="85.0" y="310" font-size="25">question에 질문 저장</text><text x="85.0" y="358" font-size="25">따옴표 안 문장 바꾸기</text><rect x="435.5" y="190" width="353.5" height="350" rx="20" fill="white" stroke="#b8cbea"/><text x="460.5" y="248" font-size="31" font-weight="700" fill="#2059a5">2. 조건과 반복</text><text x="460.5" y="310" font-size="25">질문 목록 차례로 확인</text><text x="460.5" y="358" font-size="25">빈 질문은 구분하기</text><rect x="811.0" y="190" width="353.5" height="350" rx="20" fill="white" stroke="#b8cbea"/><text x="836.0" y="248" font-size="31" font-weight="700" fill="#2059a5">3. 함수</text><text x="836.0" y="310" font-size="25">질문을 함수에 전달</text><text x="836.0" y="358" font-size="25">안내 문장 돌려받기</text><rect x="1186.5" y="190" width="353.5" height="350" rx="20" fill="white" stroke="#b8cbea"/><text x="1211.5" y="248" font-size="31" font-weight="700" fill="#2059a5">4. 딕셔너리와 JSON</text><text x="1211.5" y="310" font-size="25">번호와 질문을 함께 관리</text><text x="1211.5" y="358" font-size="25">JSON으로 저장하고 읽기</text></g></svg>