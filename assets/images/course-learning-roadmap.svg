<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc"><title id="title">생성형 AI 정규교과 · 8개 교과</title><desc id="desc">LLM 기초에서 프롬프트, 평가, 앱, RAG, 데이터 준비, 공개 모델, 파인튜닝으로 이어지는 학습 순서</desc><rect width="1600" height="650" fill="#eef4fc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="50" y="70" font-size="42" font-weight="700" fill="#17345b">생성형 AI 정규교과 · 8개 교과</text><text x="50" y="117" font-size="25" fill="#466180">작은 실행에서 출발해, 입력·근거·모델 결과를 단계별로 이해합니다.</text><rect x="50" y="155" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="70" y="202" font-size="29" font-weight="700" fill="#245faa">01 LLM 기초</text><text x="70" y="260" font-size="24" fill="#17345b">모델은 어떻게 답할까요?</text><text x="70" y="306" font-size="23" fill="#466180">Python 첫 모델 호출</text><rect x="435" y="155" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="455" y="202" font-size="29" font-weight="700" fill="#245faa">02 프롬프트</text><text x="455" y="260" font-size="24" fill="#17345b">지시를 바꾸면 달라질까요?</text><text x="455" y="306" font-size="23" fill="#466180">같은 문의·출력 조건 비교</text><rect x="820" y="155" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="840" y="202" font-size="29" font-weight="700" fill="#245faa">03 성능 평가</text><text x="840" y="260" font-size="24" fill="#17345b">어떤 답이 적절할까요?</text><text x="840" y="306" font-size="23" fill="#466180">기준·근거·판정 기록</text><rect x="1205" y="155" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="1225" y="202" font-size="29" font-weight="700" fill="#245faa">04 응용 앱</text><text x="1225" y="260" font-size="24" fill="#17345b">사용자는 어디서 질문할까요?</text><text x="1225" y="306" font-size="23" fill="#466180">요청·답변·사용자 화면</text><rect x="50" y="375" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="70" y="422" font-size="29" font-weight="700" fill="#007c70">05 RAG</text><text x="70" y="480" font-size="24" fill="#17345b">어떤 문서를 참고할까요?</text><text x="70" y="526" font-size="23" fill="#466180">문서 검색·출처 확인</text><rect x="435" y="375" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="455" y="422" font-size="29" font-weight="700" fill="#007c70">06 데이터 준비</text><text x="455" y="480" font-size="24" fill="#17345b">어떤 사례를 사용할까요?</text><text x="455" y="526" font-size="23" fill="#466180">문의 검토·데이터 분할</text><rect x="820" y="375" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="840" y="422" font-size="29" font-weight="700" fill="#007c70">07 공개 모델 활용</text><text x="840" y="480" font-size="24" fill="#17345b">모델을 직접 실행할까요?</text><text x="840" y="526" font-size="23" fill="#466180">Hugging Face·Qwen 실행</text><rect x="1205" y="375" width="365" height="195" rx="18" fill="white" stroke="#c3d6ef" stroke-width="2"/><text x="1225" y="422" font-size="29" font-weight="700" fill="#007c70">08 파인튜닝</text><text x="1225" y="480" font-size="24" fill="#17345b">학습 후 무엇이 달라질까요?</text><text x="1225" y="526" font-size="23" fill="#466180">학습 전후 비교·한계 확인</text><text x="50" y="623" font-size="23" fill="#466180">교과별 예제를 사용합니다. 실제로 넘길 결과 파일은 해당 교과에서 안내합니다.</text></g></svg>